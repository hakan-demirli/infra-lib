name: Nix Build and Test

on:
  push:
    branches: [unstable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-lib-channel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  flake-check:
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success

  promote-main:
    needs: [flake-check]
    if: github.ref == 'refs/heads/unstable' && needs.flake-check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: infra-lib-promotion
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main unstable
          main_sha=$(git rev-parse origin/main)
          unstable_sha=$(git rev-parse origin/unstable)
          if git merge-base --is-ancestor "$CANDIDATE_SHA" "$main_sha"; then
            exit 0
          fi
          git merge-base --is-ancestor "$main_sha" "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" "$unstable_sha"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" \
            -f sha="$CANDIDATE_SHA" -F force=false
