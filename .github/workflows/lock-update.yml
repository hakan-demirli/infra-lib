name: Update Dependencies

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-lib-dependency-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: bot
        with:
          app-id: ${{ vars.DEPENDENCY_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: unstable
          token: ${{ steps.bot.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - run: nix flake update nixpkgs
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        id: update
        with:
          token: ${{ steps.bot.outputs.token }}
          base: unstable
          branch: automation/update-nixpkgs
          add-paths: flake.lock
          delete-branch: true
          commit-message: 'chore: update nixpkgs'
          title: 'chore: update nixpkgs'
          body: ''
      - if: steps.update.outputs.pull-request-operation == 'created' || steps.update.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ steps.update.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          test "$(gh pr diff "$PR" --name-only)" = flake.lock
          gh pr merge "$PR" --auto --squash --subject 'chore: update nixpkgs' --body ''
