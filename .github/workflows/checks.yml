name: Required Checks

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - uses: nix-community/cache-nix-action@b05e2d861a8d616a0cd4c91de03de22dfe447f57
        with:
          primary-key: eval-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: eval-v3-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size: 1G
      - id: matrix
        run: |
          set -euo pipefail
          matrix=$(nix eval --json --no-update-lock-file .#githubActions.matrix)
          jq -e '.include | length > 0' <<< "$matrix"
          echo "value=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    name: build (${{ matrix.system }}, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - uses: nix-community/cache-nix-action@b05e2d861a8d616a0cd4c91de03de22dfe447f57
        with:
          primary-key: build-v3-${{ matrix.system }}-${{ matrix.name }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: build-v3-${{ matrix.system }}-${{ matrix.name }}-
          gc-max-store-size: 0
      - env:
          ATTRIBUTE: ${{ matrix.attr }}
        run: nix build --no-update-lock-file --print-build-logs --out-link result-ci ".#$ATTRIBUTE"

  required-result:
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length == 2 and all(.[]; .result == "success")' <<< "$RESULTS"
